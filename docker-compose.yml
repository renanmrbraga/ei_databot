services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chatbot_postgres
    restart: "no"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot-net
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 5

  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    container_name: chatbot_api
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot_frontend
    # O frontend recebe apenas variaveis nao sensiveis necessarias ao Vite.
    environment:
      NODE_ENV: development
      PORT: "8080"
      API_PROXY_TARGET: http://chatbot:8000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - chatbot
    networks:
      - chatbot-net

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  chatbot-net:
    driver: bridge
