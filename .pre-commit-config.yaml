repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.(parquet|db|duckdb|xlsx|brM3|dbm)$'

      - id: trailing-whitespace
        exclude: '\.(md|parquet|db|duckdb|xlsx|brM3|dbm)$'

      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

      - id: check-added-large-files
        args: ["--maxkb=5000"]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix --unsafe-fixes
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types_or: [python, pyi]
